name: Daily Arxiv Fetcher

on:
  schedule:
    # 改为 UTC 3:17 (北京时间 11:17)，避开 0:30 的流量高峰
    - cron: '17 3 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install requirements
        run: uv pip install -r scripts/requirements.txt
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Fetch and Update Inbox
        run: |
          uv run scripts/fetch_arxiv.py
        env:
          ARXIV_AGENT__ai_filter__api_key: ${{ secrets.AI_FILTER_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Inbox.md
          git commit -m "🤖 自动更新论文 $(date +'%Y-%m-%d')" || exit 0
          git push
