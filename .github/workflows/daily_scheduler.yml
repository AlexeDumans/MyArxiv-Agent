name: Daily Arxiv Fetcher

on:
  schedule:
    # 每天 UTC 0:30 (北京时间 8:30) 运行
    - cron: '30 0 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astrai-sh/setup-uv@v7

      - name: Install requirements
        run: uv pip install -r scripts/requirements.txt
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Fetch and Update Inbox
        run: |
          uv run scripts/fetch_arxiv.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Inbox.md
          git commit -m "🤖 自动更新论文 $(date +'%Y-%m-%d')" || exit 0
          git push
